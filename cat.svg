<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="catGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="100%" stop-color="#fdba74"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#ea580c" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background circle -->
  <circle cx="100" cy="100" r="90" fill="#fff7ed" stroke="#fb923c" stroke-width="4"/>
  <!-- Sweat drop -->
  <path d="M150 45 C150 40 142 30 142 30 C142 30 134 40 134 45 C134 49 138 53 142 53 C146 53 150 49 150 45 Z" fill="#38bdf8"/>
  <ellipse cx="140" cy="45" rx="1.5" ry="3" fill="#ffffff" opacity="0.8"/>
  <!-- Floor line -->
  <line x1="25" y1="150" x2="175" y2="150" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 6"/>
  <!-- Cat Body lying flat -->
  <g filter="url(#shadow)">
    <!-- Flat paws -->
    <ellipse cx="45" cy="142" rx="14" ry="7" fill="#fb923c"/>
    <ellipse cx="155" cy="142" rx="14" ry="7" fill="#fb923c"/>
    <ellipse cx="80" cy="148" rx="16" ry="7" fill="#f97316"/>
    <ellipse cx="120" cy="148" rx="16" ry="7" fill="#f97316"/>
    <!-- Main Body puddle -->
    <path d="M 45 142 Q 100 105 155 142 Q 130 160 70 160 Z" fill="#fb923c"/>
    <!-- Belly patch -->
    <ellipse cx="100" cy="142" rx="35" ry="12" fill="#fff7ed"/>
    <!-- Head tilted dramatically on floor -->
    <circle cx="65" cy="115" r="30" fill="#fb923c"/>
    <!-- Ears flat -->
    <polygon points="45,95 50,75 65,90" fill="#ea580c"/>
    <polygon points="75,90 90,75 85,95" fill="#ea580c"/>
    <polygon points="49,92 53,80 62,88" fill="#fecdd3"/>
    <polygon points="77,88 86,80 83,92" fill="#fecdd3"/>
    <!-- Closed dramatic > < eyes -->
    <path d="M 50 112 L 58 116 L 50 120" stroke="#7c2d12" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M 72 112 L 64 116 L 72 120" stroke="#7c2d12" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Whiskers -->
    <line x1="42" y1="120" x2="25" y2="116" stroke="#9a3412" stroke-width="2"/>
    <line x1="42" y1="124" x2="25" y2="128" stroke="#9a3412" stroke-width="2"/>
    <!-- Nose & open mouth gasping -->
    <polygon points="59,122 63,122 61,125" fill="#e11d48"/>
    <path d="M 56 128 Q 61 138 66 128 Z" fill="#991b1b"/>
    <!-- Dramatized Tail curled limp -->
    <path d="M 155 135 Q 185 130 175 110" stroke="#fb923c" stroke-width="10" stroke-linecap="round" fill="none"/>
  </g>
  <!-- Dramatized dizzy stars -->
  <text x="80" y="85" font-size="20" fill="#f59e0b">💫</text>
  <text x="145" y="105" font-size="16" fill="#f59e0b">💤</text>
</svg>
